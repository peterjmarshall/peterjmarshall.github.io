on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

concurrency:
  group: quarto-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The site is a plain Quarto project (not a website or book), which
      # `quarto publish` refuses, so render it and push _site to gh-pages.
      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      # Use the rendered HTML and its print styles to make a PDF of the CV.
      # Regenerate it on every publish so the PDF stays in sync with cv.qmd.
      - name: Generate CV PDF
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "::error::Chrome or Chromium is required to generate the CV PDF"
            exit 1
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-pdf-header-footer \
            --print-to-pdf="$GITHUB_WORKSPACE/_site/cv.pdf" \
            "file://$GITHUB_WORKSPACE/_site/cv.html"
          python -c 'from pathlib import Path; p=Path("_site/cv.pdf"); assert p.is_file() and p.stat().st_size > 10000 and p.read_bytes().startswith(b"%PDF-"); print(f"Generated {p}: {p.stat().st_size} bytes")'

      # Keep the original CV URL working with the freshly generated PDF.
      - name: Preserve legacy CV PDF link
        run: cp _site/cv.pdf _site/Peter-Marshall-CV.pdf

      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          # Push even when the rendered site is unchanged, so re-running this
          # workflow always triggers a fresh GitHub Pages deployment.
          allow_empty_commit: true
